name: Pull Request Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Format
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint:check

      - name: Stylelint
        run: pnpm stylelint:check

      - name: Typecheck
        run: pnpm typecheck
